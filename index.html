<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="layout">
      <div class="side-bar">
        <div class="first-row">
          <img
            class="dash-svg"
            src="icons/view-dashboard.svg"
            alt="Dashboard"
          />
          <h1>Dashboard</h1>
        </div>
        <div class="second-row">
          <img src="icons/home.svg" alt="Home" />
          <p>Home</p>
          <img src="icons/card-account-details-outline.svg" alt="Profile" />
          <p>Profile</p>
          <img src="icons/message-reply.svg" alt="Messages" />
          <p>Messages</p>
          <img src="icons/clock-time-three.svg" alt="History" />
          <p>History</p>
          <img src="icons/note-multiple.svg" alt="tasks" />
          <p>Tasks</p>
          <img src="icons/account-group.svg" alt="" />
          <p>Communities</p>
        </div>
        <div class="third-row">
          <img src="icons/cog.svg" alt="settings" />
          <p>Settings</p>
          <img src="icons/tooltip-question.svg" alt="support" />
          <p>Support</p>
          <img src="icons/shield-check.svg" alt="Privacy" />
          <p>Privacy</p>
        </div>
      </div>
      <div class="header">
        <div class="search-bar-container">
          <img src="icons/magnify.svg" alt="Search" />
          <div class="search-bar"></div>
          <img src="icons/bell-ring-outline.svg" alt="notifaction" />
          <img
            class="user-avatar"
            src="icons/HPn7cicXkAABPCp.jpg"
            alt="user avatar"
          />
          <div>Morgan Oakley</div>
        </div>
        <div class="nav-container">
          <img
            class="nav-user-avatar"
            src="icons/HPn7cicXkAABPCp.jpg"
            alt="user avatar"
          />
          <div class="greeting">
            <div class="greeting-msg">Hi there,</div>
            <div class="username">Morgan Oakley(@morgan)</div>
          </div>
          <button>New</button>
          <button>Upload</button>
          <button>Share</button>
        </div>
      </div>
      <div class="content">
        <p>Your Projects</p>
        <p>Announcements</p>
      </div>
    </div>
  </body>
</html>
